<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with shadow -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
  
  <!-- Subtle top inner glow -->
  <rect x="32" y="32" width="448" height="224" rx="108" fill="url(#glowGrad)"/>

  <!-- Bookmark Ribbon & Navigation Compass Symbol -->
  <g transform="translate(136, 120)" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stylized Bookmark Shape -->
    <path d="M 30 10 L 210 10 C 226 10, 240 24, 240 40 L 240 270 L 120 190 L 0 270 L 0 40 C 0 24, 14 10, 30 10 Z" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff"/>
    
    <!-- Central Sparkle / Compass Star -->
    <path d="M 120 60 L 120 140 M 80 100 L 160 100" stroke="#facc15" stroke-width="22"/>
    <polygon points="120,70 128,92 150,100 128,108 120,130 112,108 90,100 112,92" fill="#fef08a" stroke="none"/>
  </g>
</svg>
