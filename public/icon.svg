<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Cyber Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Accent Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Soft Ambient Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Shadow & Rim -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4"/>
  
  <!-- Subtle Inner Ambient Mesh -->
  <circle cx="256" cy="180" r="140" fill="#6366f1" fill-opacity="0.16" filter="blur(40px)"/>
  <circle cx="210" cy="310" r="110" fill="#38bdf8" fill-opacity="0.12" filter="blur(36px)"/>

  <!-- Futuristic Stylized Bookmark Shield / Ribbon Element -->
  <g filter="url(#softGlow)">
    <!-- Primary Bookmark Ribbon Body -->
    <path d="M 176 112 
             C 176 100, 186 92, 198 92 
             L 314 92 
             C 326 92, 336 100, 336 112 
             L 336 392 
             L 256 324 
             L 176 392 
             Z" 
          fill="url(#cyberGrad)" />

    <!-- Sleek Inset Facet -->
    <path d="M 256 120 
             L 320 120 
             L 320 366 
             L 256 312 
             Z" 
          fill="url(#ribbonGrad)" 
          opacity="0.75" />
    
    <!-- White Inner Core Cut -->
    <path d="M 216 132 
             L 296 132 
             L 296 290 
             L 256 256 
             L 216 290 
             Z" 
          fill="#0a0f1d" 
          opacity="0.9" />
  </g>

  <!-- Glowing Central Navigator Sparkle / Compass Star -->
  <g transform="translate(256, 212)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="48" fill="url(#starGlow)" opacity="0.4" filter="blur(10px)"/>

    <!-- 4-Point Primary Compass Flare -->
    <path d="M 0 -54 Q 0 0 -54 0 Q 0 0 0 54 Q 0 0 54 0 Q 0 0 0 -54 Z" fill="#ffffff"/>
    
    <!-- Diagonal Subtle Flare -->
    <path d="M -22 -22 Q 0 0 22 22 Q 0 0 -22 -22 M 22 -22 Q 0 0 -22 22 Q 0 0 22 -22" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Center Sparkling Core -->
    <circle cx="0" cy="0" r="10" fill="#fef08a"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>
</svg>
