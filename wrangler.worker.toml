name = "omnimark-api"
main = "cloudflare/worker.js"
compatibility_date = "2024-09-01"

[vars]
ENVIRONMENT = "production"

# ==============================================================================
# Cloudflare Worker (独立边缘脚本) 绑定配置说明：
# 若通过 wrangler deploy 部署独立 Worker，可直接在 Cloudflare 控制台 Worker 设置中绑定，
# 或在此处取消注释并填写真实的 D1 数据库 UUID 与 KV 命名空间 Hex ID：
# ==============================================================================
# [[d1_databases]]
# binding = "DB"
# database_name = "omnimark-db"
# database_id = "00000000-0000-0000-0000-000000000000"

# [[kv_namespaces]]
# binding = "CACHE_KV"
# id = "0123456789abcdef0123456789abcdef"
