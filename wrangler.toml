name = "omnimark-api"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"

# ==============================================================================
# Cloudflare Pages 数据库与缓存绑定配置指南：
# 
# 【最佳实践（推荐）】：
# 在 Cloudflare 网页控制台的 Pages 项目设置中添加绑定（无需在代码中硬编码任何真实 ID）：
# 1. 登录 Cloudflare Dashboard -> Workers & Pages -> 找到你的 Pages 项目
# 2. 点击 设置 (Settings) -> 函数 (Functions)
# 3. 找到 "D1 数据库绑定" (D1 database bindings) -> 点击添加：
#    - 变量名称：严格设为 DB
#    - D1 数据库：选择你的数据库 (例如 omnimark-db)
# 4. 找到 "KV 命名空间绑定" (KV namespace bindings) -> 点击添加：
#    - 变量名称：严格设为 CACHE_KV
#    - KV 命名空间：选择你的 KV 空间 (例如 omnimark-cache)
#
# 【文件硬编码方式（可选）】：
# 如果你希望直接在代码仓库中维护真实 ID，请取消下方注释，并将真实的 32位 UUID / Hex 填入：
# ==============================================================================
# [[d1_databases]]
# binding = "DB"
# database_name = "omnimark-db"
# database_id = "00000000-0000-0000-0000-000000000000"

# [[kv_namespaces]]
# binding = "CACHE_KV"
# id = "0123456789abcdef0123456789abcdef"
