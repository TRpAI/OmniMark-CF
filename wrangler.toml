name = "omnimark-api"
main = "cloudflare/worker.js"
compatibility_date = "2024-09-01"

# Cloudflare D1 数据库绑定（请将 database_id 替换为您的实际 D1 数据库 UUID）
[[d1_databases]]
binding = "DB"
database_name = "omnimark-db"
database_id = "your-d1-database-uuid"

# Cloudflare KV 命名空间绑定（请将 id 替换为您的实际 KV 空间 ID）
[[kv_namespaces]]
binding = "CACHE_KV"
id = "your-kv-namespace-id"

[vars]
ENVIRONMENT = "production"
